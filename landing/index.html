<body><main><div class="brand"><img src="./assets/ftx-logo.svg" alt="FTX logo"><p>FTX FARMING</p></div><h1>Grow with better information.</h1><p>Market prices, planting guidance, crop listings, farmer profiles, and agricultural news in one simple app.</p><section class="card"><h2>Get the FTX app</h2><p>Download the Android app to manage your farm from anywhere.</p><a id="download" href="./app/FTX.apk" download>Download FTX</a><p id="version">Latest version information is loading...</p></section></main><script>fetch('./app/version.json').then(r=>r.ok?r.json():null).then(v=>{if(v){document.getElementById('version').textContent='Version '+v.version+' · '+v.updated}}).catch(()=>{document.getElementById('version').textContent='Latest Android build'})</script></body>
