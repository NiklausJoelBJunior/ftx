name: Build and release FTX Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag
        required: true
        default: v1.0.0
  release:
    types: [published]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Setup Expo and EAS
        run: npm install --global eas-cli
      - name: Build signed Android APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "EXPO_PUBLIC_API_URL secret is required" >&2
            exit 1
          fi
          printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL" > .env.production
          eas build --platform android --profile preview --non-interactive --wait --output=../FTX.apk
      - name: Publish APK to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ]; then TAG="v1.0.${GITHUB_RUN_NUMBER}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FTX.apk --clobber
          else
            gh release create "$TAG" FTX.apk --title "FTX $TAG" --notes "Automated Android APK build"
          fi
